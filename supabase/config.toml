# Supabase CLI settings for this project (ww-copilot). Only what the app relies on.
project_id = "jiblxvnjjnrrapzieedm"

# Username sign-in: the person has no session yet, so no JWT is checked here
# (the function checks the password itself). A redeploy without this line
# would make every username sign-in fail.
[functions.sign-in]
verify_jwt = false

# Invites need the admin's session.
[functions.invite-user]
verify_jwt = true

# Google Drive link: Google sends the admin back here after they sign in, with
# no session, so no JWT is checked (the function checks its own one-time state;
# start / status / disconnect check the caller themselves).
[functions.drive-connect]
verify_jwt = false

# Copy photos to Drive: an editor's or the admin's session.
[functions.drive-photo]
verify_jwt = true
